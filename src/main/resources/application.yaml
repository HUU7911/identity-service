spring:
  datasource:
    url: ${DB_URL}
    username: ${USER_NAME}
    password: ${PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

server:
  port: 8080
  servlet:
    context-path: /identity

jwt:
  signerKey: ${SIGNER_KEY}
  valid-duration: ${VALID}
  refreshable-duration: ${REFRESHABLE}

app:
  config:
    client-id: ${CLIENT_ID}
    client-secret: ${CLIENT_SECRET}
    redirect-url: ${REDIRECT_URL}